name: Docker CI Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-docker:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Show files
        run: ls -la
      
      - name: Build Docker image
        run: docker build -t my-first-app .
      
      - name: List Docker images
        run: docker images
      
      - name: Run the container
        run: docker run my-first-app
